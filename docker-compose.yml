version: "3.8"

services:
  mongo:
    image: mongo:latest
    container_name: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    # volumes:
    #   - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - backend

  gradio:
    container_name: gradio
    build: .
    volumes:
      - .:/app
    working_dir: /app
    command: python gradio_app.py
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - MONGO_URL=mongodb://root:example@mongo:27017/?authSource=admin
    depends_on:
      - mongo
    networks:
      - backend

  fastapi-app:
    build:
      context: .
    container_name: fastapi-app
    ports:
      - "7861:7860"
    env_file:
      - .env
    depends_on:
      - mongo
    networks:
      - backend

volumes:
  mongo_data:

networks:
  backend:
    driver: bridge
